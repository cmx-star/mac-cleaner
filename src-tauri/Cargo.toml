[package]
name = "talpa-desktop"
version = "0.1.0"
description = "Talpa 桌面版 - 基于 Mole CLI 的 Mac 清理与维护界面"
authors = ["Talpa Desktop Contributors"]
edition = "2021"
rust-version = "1.77"
default-run = "talpa-desktop"

[lib]
name = "talpa_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread", "time"] }
walkdir = "2"
sysinfo = "0.33"
chrono = { version = "0.4", features = ["serde"] }
trash = "5.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
